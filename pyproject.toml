[project]
name = "hello"
version = "0.1.0"
description = "An example Django app running in Docker."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "django==6.1.1",
  "celery==5.6.3",
  "django-debug-toolbar==8.0.0",
  "gunicorn==26.2.0",
  "psycopg==3.3.5",
  "redis==8.1.0",
  "ruff==0.16.7",
  "setuptools==84.0.0",
  "whitenoise==6.12.0",
]

[tool.ruff]
line-length = 79
# Avoid review generated files automatically for Django
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
extend-select = ["I", "SIM", "E501"]
