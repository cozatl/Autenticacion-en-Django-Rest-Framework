{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>User Profile</h2>
    <div class="card p-4 mt-3 shadow-sm">
        <p><strong>Full Name:</strong> {{ user.get_full_name|default:user.email }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Register date:</strong> {{ user.timestamp|date:"d/m/Y H:i" }}</p>
        
        {% if user.is_staff %}
            <p><span class="badge bg-primary">Staff User</span></p>
        {% endif %}

        <div class="mt-3">
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-secondary">Log Out / Change account</button>
            </form>
        </div>
    </div>
    <a href="{% url 'products:home' %}" class="btn btn-primary">Go to main page</a>
</div>
{% endblock %}
